name: Stage 1 - Import full AyuGram base

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-ayugram-base.yml"

permissions:
  contents: write

concurrency:
  group: sealgram2-import-ayugram
  cancel-in-progress: false

jobs:
  import-ayugram:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SealGram2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone AyuGram rewrite branch with submodules
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch rewrite --recurse-submodules --shallow-submodules https://github.com/AyuGram/AyuGram4A.git /tmp/ayugram
          git -C /tmp/ayugram submodule status --recursive || true

      - name: Replace project tree with full AyuGram source
        shell: bash
        run: |
          set -euo pipefail
          # Keep the target repository's .git metadata and the two audit/port-plan documents.
          # Preserve this workflow so later stages remain runnable.
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/SECURITY_AUDIT_STAGE1.md' \
            --exclude='/AYUGRAM_PORT_MAP.md' \
            --exclude='/.github/workflows/import-ayugram-base.yml' \
            /tmp/ayugram/ "$GITHUB_WORKSPACE"/
          git status --short | head -200

      - name: Commit AyuGram baseline into SealGram2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Working tree already matches AyuGram baseline."
            exit 0
          fi
          git commit -m "chore: import full AyuGram rewrite baseline"
          git push origin HEAD:main

      - name: Report baseline
        shell: bash
        run: |
          echo "Imported AyuGram rewrite into SealGram2."
          echo "This stage intentionally does not yet remove telemetry or port SealGram customizations."
          echo "Next stage: audit and selectively disable/remove privacy-sensitive telemetry and upstream endpoints."
