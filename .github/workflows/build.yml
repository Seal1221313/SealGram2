name: Build

on:
  push:
    branches: [main]
    paths:
      - 'TMessagesProj/build.gradle'
      - 'TMessagesProj/src/main/res/values/extera.xml'
      - 'TMessagesProj/src/main/res/values/strings.xml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      task:
        description: Gradle task
        default: ':TMessagesProj:assembleBetaDebug'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK/NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.1" "ndk;21.4.7075529" "cmake;3.10.2.4988404"

      - name: Signing key and API keys
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          MAPS_KEY: ${{ secrets.MAPS_V2_API }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > TMessagesProj/config/sealgram.jks
            if [ -z "$STORE_PASS" ]; then
              echo "::error::SIGNING_KEYSTORE_BASE64 is set but SIGNING_STORE_PASSWORD is empty."
              exit 1
            fi
            # If the alias secret is missing, discover the first key entry from the supplied keystore.
            if [ -z "$KEY_ALIAS" ]; then
              KEY_ALIAS=$(keytool -list -v -keystore TMessagesProj/config/sealgram.jks -storepass "$STORE_PASS" 2>/dev/null | awk -F': ' '/Alias name:/{print $2; exit}')
            fi
            if [ -z "$KEY_ALIAS" ]; then
              echo "::error::Could not determine key alias. Set SIGNING_KEY_ALIAS to the alias shown by keytool."
              exit 1
            fi
            KEY_PASS="${KEY_PASS:-$STORE_PASS}"
            keytool -list -keystore TMessagesProj/config/sealgram.jks -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null
          else
            STORE_PASS=$(openssl rand -hex 12); KEY_PASS=$STORE_PASS; KEY_ALIAS=sealgram
            keytool -genkeypair -keystore TMessagesProj/config/sealgram.jks -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SealGram"
          fi
          {
            echo "SIGNING_KEY_STORE_PASSWORD=$STORE_PASS"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASS"
            echo "APP_ID=${APP_ID:-1}"
            echo "APP_HASH=\"${APP_HASH:-00000000000000000000000000000000}\""
            echo "MAPS_V2_API=${MAPS_KEY}"
          } > API_KEYS

      - name: Build debug
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace "${{ inputs.task || ':TMessagesProj:assembleBetaDebug' }}" 2>&1 | tee build.log

      - name: Verify APK before publishing
        if: success()
        run: |
          set -euo pipefail
          APK=$(find TMessagesProj/build/outputs/apk -name "*.apk" -type f | head -n 1)
          test -n "$APK"
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/33.0.1/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/33.0.1/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/33.0.1/aapt2" dump badging "$APK" | head -n 8
          sha256sum "$APK"

      - name: Release APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find TMessagesProj/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK" SealGram.apk
          gh release delete beta --cleanup-tag -y || true
          gh release create beta SealGram.apk --title "SealGram" --notes "SealGram beta build ${{ github.sha }}" --prerelease

      - name: Publish direct APK download
        if: success()
        run: |
          {
            echo "## SealGram — готовый APK"
            echo
            echo "[**Скачать APK напрямую**](https://github.com/${GITHUB_REPOSITORY}/releases/download/beta/SealGram.apk)"
            echo
            echo "Файл: `SealGram.apk`"
            echo
            echo "Сборка: `${GITHUB_SHA}`"
            echo
            echo "> ZIP в разделе Actions → Artifacts — это архив GitHub Actions. Для установки без распаковки скачивайте APK по ссылке выше."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK audit
        if: always()
        run: |
          mkdir -p /tmp/a /tmp/l
          APK=$(find TMessagesProj/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "no apk" > /tmp/l/audit.txt; exit 0; fi
          cd /tmp/a && unzip -qo "$GITHUB_WORKSPACE/$APK"
          {
            echo "== apk: $APK"; ls -l "$GITHUB_WORKSPACE/$APK"
            echo "== permissions"; "$ANDROID_HOME/build-tools/33.0.1/aapt2" dump permissions "$GITHUB_WORKSPACE/$APK" | sort -u
            echo "== urls in dex"; cat classes*.dex | strings -n 8 | grep -oE "https?://[A-Za-z0-9._~:/?#@!$&'*+,;=%-]+" | sort -u
            echo "== urls in native"; for f in lib/*/*.so; do strings -n 8 "$f" | grep -oE "https?://[A-Za-z0-9._~:/?#@!$&'*+,;=%-]+" ; done | sort -u
            echo "== ipv4 in native/dex"; (cat classes*.dex; cat lib/*/*.so) | strings -n 7 | grep -oE "\b[0-9]{1,3}(\.[0-9]{1,3}){3}\b" | sort -u
            echo "== suspicious classes"; cat classes*.dex | strings -n 6 | grep -iE "firebase|crashlytics|appcenter|appsflyer|facebook|adjust|mixpanel|amplitude|sentry|appmetrica|ayugram\.one|exteragram\.app|DexClassLoader" | sort -u | head -80
          } > /tmp/l/audit.txt 2>&1

      - name: Publish log
        if: always()
        run: |
          mkdir -p /tmp/l
          grep -nE "error:|FAILED|What went wrong|Execution failed|Could not|cannot find symbol|symbol:|location:|does not exist" -A2 build.log | head -c 150000 > /tmp/l/errors.txt || true
          tail -n 300 build.log > /tmp/l/tail.txt || true
          touch /tmp/l/audit.txt
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs
          git rm -rf . -q
          cp /tmp/l/errors.txt /tmp/l/tail.txt /tmp/l/audit.txt .
          git add errors.txt tail.txt audit.txt
          git commit -qm "build log"
          git push -f origin ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: sealgram-debug
          path: TMessagesProj/build/outputs/apk/**/*.apk
