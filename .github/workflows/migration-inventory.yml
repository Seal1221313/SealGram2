name: Inventory SealGram to Telegram 13.1.1 migration

on:
  push:
    branches: ["upgrade/telegram-13.1.1"]
    paths: ['.github/workflows/migration-inventory.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current SealGram mod
        uses: actions/checkout@v4
        with:
          ref: upgrade/telegram-13.1.1
          path: sealgram-old
          submodules: false
          fetch-depth: 0

      - name: Checkout official Telegram 13.1.1
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          ref: 3de37c8cfb039452be7398909461da6288babf15
          path: telegram-upstream
          submodules: recursive
          fetch-depth: 1

      - name: Compare tracked source trees
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          old_root = Path("sealgram-old")
          new_root = Path("telegram-upstream")
          ignored = {".git", ".gradle", ".idea", "build", ".cxx"}
          def files(root):
              found = {}
              for p in root.rglob("*"):
                  if not p.is_file() or any(part in ignored for part in p.parts):
                      continue
                  rel = p.relative_to(root).as_posix()
                  if rel.startswith(".git/"):
                      continue
                  try:
                      found[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
                  except (OSError, PermissionError):
                      pass
              return found

          old = files(old_root)
          new = files(new_root)
          old_paths, new_paths = set(old), set(new)
          only_old = sorted(old_paths - new_paths)
          only_new = sorted(new_paths - old_paths)
          changed = sorted(p for p in old_paths & new_paths if old[p] != new[p])

          out = [
              "# SealGram → Telegram 13.1.1 source inventory",
              "",
              "This is a file-level inventory, not proof of semantic equivalence. Same-path changes may include upstream changes, mod changes, generated files, or both. Each feature must be reviewed before porting.",
              "",
              f"- SealGram files scanned: {len(old)}",
              f"- Upstream files scanned: {len(new)}",
              f"- Paths only in SealGram tree: {len(only_old)}",
              f"- Paths only in Telegram upstream: {len(only_new)}",
              f"- Same-path files with different SHA-256: {len(changed)}",
              "",
              "## Only in old SealGram tree",
              *[f"- `{p}`" for p in only_old],
              "",
              "## Only in Telegram 13.1.1",
              *[f"- `{p}`" for p in only_new],
              "",
              "## Same path, different content",
              *[f"- `{p}`" for p in changed],
              "",
              "## Review guidance",
              "- Treat the old SealGram tree as the feature source and Telegram 13.1.1 as the new base.",
              "- Do not blindly copy whole directories over upstream; resolve API/TL/resource/build conflicts.",
              "- Record each discovered custom feature as ported, replaced by upstream, intentionally removed, or blocked.",
              "- Build and regression-test after each feature group; do not merge until parity review and CI pass.",
          ]
          Path("migration-inventory.md").write_text("\n".join(out) + "\n", encoding="utf-8")
          print("\n".join(out[:10]))
          PY

      - name: Upload migration inventory
        uses: actions/upload-artifact@v4
        with:
          name: sealgram-telegram-13.1.1-migration-inventory
          path: migration-inventory.md
          if-no-files-found: error
          retention-days: 14
