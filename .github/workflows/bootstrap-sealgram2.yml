name: Bootstrap SealGram2 from SealGram-clean

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-sealgram2.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-sealgram2
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout SealGram2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import full SealGram-clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Seal1221313/SealGram-clean.git /tmp/sealgram-clean
          # Import all tracked project files, source code, resources, and assets.
          # Keep SealGram2's audit and port-plan documents.
          tar --exclude=.git -C /tmp/sealgram-clean -cf - . | tar -C "$GITHUB_WORKSPACE" -xf -
          git status --short

      - name: Commit imported baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "chore: import full SealGram-clean baseline"
          git push origin HEAD:main

      - name: Report imported project
        run: |
          echo "SealGram-clean source tree imported into SealGram2."
          echo "This is the baseline stage only; AyuGram feature code has not yet been merged."
          echo "Run the Android build workflow separately after confirming repository secrets and submodules."
