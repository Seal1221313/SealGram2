name: Port SealGram core helpers onto Telegram 13.1.1

on:
  workflow_dispatch:
  push:
    branches:
      - upgrade/telegram-13.1.1
    paths:
      - ".github/workflows/port-core-helpers.yml"

permissions:
  contents: write

env:
  PORT_BRANCH: upgrade/telegram-13.1.1-port-core
  PORT_COMMIT_MESSAGE: "Port SealGram settings hub, style, auto-reply, speech and voice classes onto Telegram 13.1.1"
  FAST_ONLY: "true"
  PORT_FILES: >-
    messenger/SealFont.java
    messenger/SealTheme.java
    ui/SealColorDialog.java
    messenger/SealAutoReply.java
    messenger/SealStt.java
    messenger/SealVoice.java
    ui/SealGramHubActivity.java
    ui/SealGramStyleActivity.java
    ui/SealGramVoiceActivity.java

jobs:
  port:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SealGram source
        uses: actions/checkout@v4
        with:
          ref: upgrade/telegram-13.1.1
          path: sealgram-old
          fetch-depth: 1

      - name: Checkout upstream-based port branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PORT_BRANCH }}
          path: telegram-new
          fetch-depth: 1
          submodules: recursive

      - name: Port SealGram classes
        shell: bash
        run: |
          set -euo pipefail
          src="sealgram-old/TMessagesProj/src/main/java/org/telegram"
          dst="telegram-new/TMessagesProj/src/main/java/org/telegram"
          for file in $PORT_FILES; do
            test -s "$src/$file"
            cp "$src/$file" "$dst/$file"
            echo "Ported: $file"
          done
          test -s "$dst/messenger/SealGram.java"
          test -s "$dst/messenger/SealGramI18n.java"
          grep -q "SealFont.get(assetPath)" "$dst/messenger/AndroidUtilities.java"

      - name: Apply upstream compatibility patches
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          def patch(path, old, new, marker):
              s = open(path, encoding="utf-8").read()
              if marker in s:
                  print("Already patched:", path, marker)
                  return
              if s.count(old) != 1:
                  sys.exit("Anchor not found exactly once in %s: %r" % (path, old))
              open(path, "w", encoding="utf-8").write(s.replace(old, new))
              print("Patched:", path, marker)

          patch(
              "telegram-new/TMessagesProj/build.gradle",
              "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'\n}",
              "    implementation 'net.java.dev.jna:jna:5.13.0@aar'\n"
              "    implementation('com.alphacephei:vosk-android:0.3.75') {\n"
              "        exclude group: 'net.java.dev.jna', module: 'jna'\n"
              "    }\n\n"
              "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'\n}",
              "vosk-android:0.3.75")

          patch(
              "telegram-new/TMessagesProj/src/main/java/org/telegram/messenger/SealAutoReply.java",
              "SendMessagesHelper.getInstance(account).sendMessage(text(), dialogId, null, null, null, true, null, null, null, true, 0, null, false);",
              "SendMessagesHelper.getInstance(account).sendMessage(SendMessagesHelper.SendMessageParams.of(text(), dialogId, null, null, null, true, null, null, null, true, 0, 0, null, false));",
              "SendMessageParams.of(text(), dialogId")
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fast Java compile check
        working-directory: telegram-new
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj:compileDebugJavaWithJavac

      - name: Full APK build
        if: env.FAST_ONLY != 'true'
        working-directory: telegram-new
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatDebug

      - name: Publish to port branch
        if: env.FAST_ONLY != 'true'
        working-directory: telegram-new
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TMessagesProj/build.gradle
          git add -A TMessagesProj/src
          if git diff --cached --quiet; then
            echo "No port changes to publish."
            exit 0
          fi
          git commit -m "$PORT_COMMIT_MESSAGE"
          git push origin "HEAD:refs/heads/$PORT_BRANCH"

      - name: Upload test APK
        if: env.FAST_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-13.1.1-seal-hub-smoke-test
          path: telegram-new/TMessagesProj_App/build/outputs/apk/**/**/*.apk
          if-no-files-found: warn
          retention-days: 7
