name: Port SealGram core helpers onto Telegram 13.1.1

on:
  workflow_dispatch:
  push:
    branches:
      - upgrade/telegram-13.1.1
    paths:
      - ".github/workflows/port-core-helpers.yml"

permissions:
  contents: write

env:
  PORT_BRANCH: upgrade/telegram-13.1.1-port-core
  PORT_COMMIT_MESSAGE: "Port SealGram font, theme and color helpers onto Telegram 13.1.1"

jobs:
  port:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SealGram source
        uses: actions/checkout@v4
        with:
          ref: upgrade/telegram-13.1.1
          path: sealgram-old
          fetch-depth: 1

      - name: Checkout upstream-based port branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PORT_BRANCH }}
          path: telegram-new
          fetch-depth: 1
          submodules: recursive

      - name: Port font, theme and color helpers
        shell: bash
        run: |
          set -euo pipefail
          src="sealgram-old/TMessagesProj/src/main/java/org/telegram"
          dst="telegram-new/TMessagesProj/src/main/java/org/telegram"
          for file in messenger/SealFont.java messenger/SealTheme.java ui/SealColorDialog.java; do
            test -s "$src/$file"
            cp "$src/$file" "$dst/$file"
            echo "Ported: $file"
          done
          test -s "$dst/messenger/SealGram.java"
          test -s "$dst/messenger/SealGramI18n.java"
          python3 - <<'PY'
          p = "telegram-new/TMessagesProj/src/main/java/org/telegram/messenger/AndroidUtilities.java"
          s = open(p, encoding="utf-8").read()
          sig = "    public static Typeface getTypeface(String assetPath) {\n"
          hook = "        Typeface sealFont = SealFont.get(assetPath);\n        if (sealFont != null) {\n            return sealFont;\n        }\n"
          if "SealFont.get(assetPath)" in s:
              print("Font hook already present")
          else:
              if s.count(sig) != 1:
                  raise SystemExit("getTypeface signature not found exactly once")
              s = s.replace(sig, sig + hook)
              open(p, "w", encoding="utf-8").write(s)
              print("Font hook inserted into AndroidUtilities.getTypeface")
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Build upstream with ported helper groups
        working-directory: telegram-new
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatDebug

      - name: Publish to port branch
        if: success()
        working-directory: telegram-new
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TMessagesProj/src/main/java/org/telegram/messenger/SealFont.java \
                  TMessagesProj/src/main/java/org/telegram/messenger/SealTheme.java \
                  TMessagesProj/src/main/java/org/telegram/ui/SealColorDialog.java \
                  TMessagesProj/src/main/java/org/telegram/messenger/AndroidUtilities.java
          if git diff --cached --quiet; then
            echo "No port changes to publish."
            exit 0
          fi
          git commit -m "$PORT_COMMIT_MESSAGE"
          git push origin "HEAD:refs/heads/$PORT_BRANCH"

      - name: Upload test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-13.1.1-font-theme-smoke-test
          path: telegram-new/TMessagesProj_App/build/outputs/apk/**/**/*.apk
          if-no-files-found: warn
          retention-days: 7
